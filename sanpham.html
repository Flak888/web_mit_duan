<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm - Có Ảnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f8f9fc; /* Màu nền trùng với index để trong suốt */
    }

    /* Card chứa bảng dữ liệu */
    .container, .container-fluid {
        background: white !important;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        padding: 30px !important;
        border: none !important;
        margin-top: 10px;
    }

    h2 {
        font-weight: 700;
        color: #4e73df;
        text-transform: uppercase;
        font-size: 1.8rem;
        margin-bottom: 30px;
    }

    /* Tìm kiếm & Nút */
    .form-control {
        border-radius: 50px;
        padding: 10px 20px;
        border: 1px solid #d1d3e2;
        box-shadow: none;
    }
    .form-control:focus {
        border-color: #4e73df;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
    }

    .btn {
        border-radius: 50px;
        padding: 8px 20px;
        font-weight: 500;
        transition: transform 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: #4e73df; border: none; }
    .btn-success { background: #1cc88a; border: none; }
    .btn-danger { background: #e74a3b; border: none; }
    .btn-warning { background: #f6c23e; color: white; border: none; }

    /* Bảng dữ liệu đẹp */
    .table {
        margin-top: 20px;
        border-collapse: separate; 
        border-spacing: 0 10px; /* Tạo khoảng cách giữa các hàng */
    }
    
    .table thead th {
        border: none;
        background-color: #f1f3f9;
        color: #6e707e;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85rem;
        padding: 15px;
    }

    .table tbody tr {
        background: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        transition: all 0.2s;
    }

    .table tbody tr:hover {
        transform: scale(1.01);
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        z-index: 10;
        position: relative;
    }

    .table td {
        border: none;
        vertical-align: middle;
        padding: 15px;
        border-top: 1px solid #f8f9fc;
        font-size: 0.95rem;
        color: #5a5c69;
    }

    /* Làm tròn góc cho hàng đầu và cuối */
    .table tbody tr td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
    .table tbody tr td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

    /* Modal */
    .modal-content {
        border-radius: 20px;
        border: none;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }
    .modal-header {
        border-bottom: 1px solid #f1f3f9;
        background: #4e73df;
        color: white;
        border-radius: 20px 20px 0 0;
    }
    .btn-close { filter: invert(1); }
</style>
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow">
    <h2 class="text-primary text-center mb-4">QUẢN LÝ KHO SẢN PHẨM</h2>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="search" class="form-control" placeholder="Tìm kiếm sản phẩm...">
        </div>
        <div class="col-md-8 text-end">
            <button class="btn btn-primary" id="btnAdd" data-bs-toggle="modal" data-bs-target="#modalSanPham">
                <i class="fas fa-plus"></i> Thêm Mới
            </button>
        </div>
    </div>

    <table class="table table-bordered table-hover align-middle text-center">
        <thead class="table-primary">
            <tr>
                <th>Ảnh</th> <th>Tên Sản Phẩm</th>
                <th>Danh Mục</th>
                <th>Đơn Giá</th>
                <th>Tồn Kho</th> <th>Mô Tả</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="modal fade" id="modalSanPham">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Thông tin sản phẩm</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formSP">
                    <input type="hidden" id="idSP" name="id">
                    <input type="hidden" id="action" name="action" value="insert">
                    <input type="hidden" id="oldImg" name="oldImg"> <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Tên Sản Phẩm</label>
                            <input type="text" id="tenSP" name="ten" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Danh Mục</label>
                            <select id="maDM" name="madm" class="form-select"></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Đơn Giá (VNĐ)</label>
                            <input type="number" id="donGia" name="gia" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="fw-bold">Số Lượng Tồn</label>
                            <input type="number" id="soLuongTon" name="ton" class="form-control" value="0">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="fw-bold">Hình Ảnh</label>
                            <input type="file" id="hinhAnh" name="hinhAnh" class="form-control" accept="image/*">
                            <div class="mt-2" id="previewImg"></div> </div>
                        <div class="col-md-12 mb-3">
                            <label class="fw-bold">Mô Tả</label>
                            <textarea id="moTa" name="mota" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary" id="btnSave">Lưu Dữ Liệu</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {
    loadSanPham();
    loadDanhMuc();

    // 1. Tải danh sách sản phẩm
    function loadSanPham() {
        $.post("sanpham_api.php", { action: "fetch" }, function (data) {
            let rows = "";
            $.each(JSON.parse(data), function (i, v) {
                let gia = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(v.DonGia);
                
                // Xử lý hiển thị ảnh
                let imgHtml = '<span class="text-muted">Không ảnh</span>';
                if(v.HinhAnh) {
                    imgHtml = `<img src="uploads/${v.HinhAnh}" style="height: 50px; width: auto; border-radius: 5px;">`;
                }

                rows += `
                <tr>
                    <td>${imgHtml}</td>
                    <td class="fw-bold text-start">${v.TenSanPham}</td>
                    <td><span class="badge bg-info text-dark">${v.TenDanhMuc || 'Chưa phân loại'}</span></td>
                    <td class="text-danger fw-bold">${gia}</td>
                    <td>${v.SoLuongTon}</td>
                    <td class="text-start small text-muted">${v.MoTa || ''}</td>
                    <td>
                        <button class="btn btn-warning btn-sm btnEdit" data-json='${JSON.stringify(v)}'><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm btnDelete" data-id="${v.MaSanPham}"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            $("#tableBody").html(rows);
        });
    }

    // 2. Load Danh Mục vào Select
    function loadDanhMuc() {
        $.post("sanpham_api.php", { action: "fetch_danhmuc" }, function (data) {
            let ops = "";
            $.each(JSON.parse(data), function (i, v) {
                ops += `<option value="${v.MaDanhMuc}">${v.TenDanhMuc}</option>`;
            });
            $("#maDM").html(ops);
        });
    }

    // 3. Nút Thêm Mới
    $("#btnAdd").click(function(){
        $("#formSP")[0].reset(); // Reset form
        $("#idSP").val("");
        $("#oldImg").val("");
        $("#action").val("insert");
        $("#previewImg").html("");
    });

    // 4. Nút Sửa
    $(document).on("click", ".btnEdit", function () {
        let data = $(this).data("json");
        $("#idSP").val(data.MaSanPham);
        $("#tenSP").val(data.TenSanPham);
        $("#donGia").val(data.DonGia);
        $("#soLuongTon").val(data.SoLuongTon);
        $("#moTa").val(data.MoTa);
        $("#maDM").val(data.MaDanhMuc);
        $("#oldImg").val(data.HinhAnh);
        $("#action").val("update");

        // Hiện ảnh cũ nếu có
        if(data.HinhAnh) {
            $("#previewImg").html(`<small>Ảnh hiện tại:</small><br><img src="uploads/${data.HinhAnh}" height="80">`);
        } else {
            $("#previewImg").html("");
        }
        
        $("#modalSanPham").modal("show");
    });

    // 5. Nút LƯU (Quan trọng: Dùng FormData để upload file)
    $("#btnSave").click(function () {
        // Tạo đối tượng FormData từ thẻ form
        let formData = new FormData(document.getElementById("formSP"));

        $.ajax({
            url: 'sanpham_api.php',
            type: 'POST',
            data: formData,
            processData: false, // Bắt buộc khi upload file
            contentType: false, // Bắt buộc khi upload file
            success: function(response) {
                $("#modalSanPham").modal("hide");
                loadSanPham(); // Load lại bảng
            }
        });
    });

    // 6. Xóa
    $(document).on("click", ".btnDelete", function () {
        if(confirm("Bạn có chắc chắn muốn xóa?")) {
            $.post("sanpham_api.php", { action: "delete", id: $(this).data("id") }, function(){ loadSanPham(); });
        }
    });

     // 7. Tìm kiếm
     $("#search").on("keyup", function () {
        let value = $(this).val().toLowerCase();
        $("#tableBody tr").filter(function () {
            $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
    });
});
</script>
</body>
</html>
